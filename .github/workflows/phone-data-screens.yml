name: Phone Data screenshots (temporary)

# Throwaway: renders the Phone Data screens in the simulator (reviewer mode) and uploads
# screenshots. Removed before merging to main.

on:
  push:
    branches: ["claude/native-swift-rewrite-phone-data"]

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: PhoneDataEngine/go.mod
          cache-dependency-path: PhoneDataEngine/go.sum
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project with screenshot target
        run: xcodegen generate --spec ci-screens.yml
      - name: Run screenshot UI tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone 1[0-9] Pro[^(]*|iPhone [^(]+' | head -1 | xargs)
          echo "Device: $DEVICE"
          xcodebuild test -project Lucinate.xcodeproj -scheme LucinateScreens \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath screens.xcresult -quiet \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO || true
      - name: Export attachments
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path screens.xcresult --output-path shots || true
          ls -la shots | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: phone-data-screens
          path: shots
          if-no-files-found: warn
