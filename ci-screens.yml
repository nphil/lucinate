include:
  - path: project.yml
targets:
  LucinateScreens:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ci-screens/UITests
    dependencies:
      - target: Lucinate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cogwheel.lucimobile.screens
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LucinateScreens:
    build:
      targets:
        Lucinate: all
        LucinateScreens: [test]
    test:
      targets:
        - LucinateScreens
